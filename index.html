<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年 午年運勢占い</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background: linear-gradient(135deg, #1a0533 0%, #2d1b4e 50%, #4a1942 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2em;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .horse {
            font-size: 3em;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1em;
        }

        input[type="text"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .fortune-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .fortune-option {
            position: relative;
        }

        .fortune-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .fortune-option label {
            display: block;
            padding: 15px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .fortune-option input[type="radio"]:checked + label {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .fortune-option label:hover {
            border-color: #ffd700;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1a0533;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .result {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .fortune-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="header">
            <h1>✨ 2026年 午年運勢占い ✨</h1>
            <div class="horse">🐴🌙⭐</div>
        </div>

        <div class="card" id="inputSection">
            <div id="fortuneForm">
                <div class="form-group">
                    <label for="name">お名前（ペンネームOK）</label>
                    <input type="text" id="name" placeholder="例：花子">
                </div>

                <div class="form-group">
                    <label for="birthdate">生年月日</label>
                    <input type="date" id="birthdate">
                </div>

                <div class="form-group">
                    <label>占いたい運勢を選択</label>
                    <div class="fortune-options">
                        <div class="fortune-option">
                            <input type="radio" id="work" name="fortune" value="work" checked>
                            <label for="work">💼 仕事運</label>
                        </div>
                        <div class="fortune-option">
                            <input type="radio" id="money" name="fortune" value="money">
                            <label for="money">💰 金運</label>
                        </div>
                        <div class="fortune-option">
                            <input type="radio" id="love" name="fortune" value="love">
                            <label for="love">💕 恋愛運</label>
                        </div>
                        <div class="fortune-option">
                            <input type="radio" id="health" name="fortune" value="health">
                            <label for="health">🌿 健康運</label>
                        </div>
                    </div>
                </div>

                <button type="button" class="submit-btn" id="submitBtn">🔮 運勢を占う 🔮</button>
            </div>
        </div>

        <div class="card result" id="resultSection">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>カードをシャッフル中...</p>
            </div>
            <div id="results"></div>
        </div>
    </div>

    <script>
        // 星を生成
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // 保存されたデータを復元
        const savedName = localStorage.getItem('fortune_name');
        const savedBirthdate = localStorage.getItem('fortune_birthdate');
        const savedFortune = localStorage.getItem('fortune_type');

        if (savedName) document.getElementById('name').value = savedName;
        if (savedBirthdate) document.getElementById('birthdate').value = savedBirthdate;
        if (savedFortune) {
            const radio = document.getElementById(savedFortune);
            if (radio) radio.checked = true;
        }

        // タロットカード（簡略版）
        const tarotCards = [
            { name: "愚者", symbol: "🃏" },
            { name: "魔術師", symbol: "🎩" },
            { name: "女教皇", symbol: "📿" },
            { name: "女帝", symbol: "👑" },
            { name: "皇帝", symbol: "⚔️" },
            { name: "教皇", symbol: "🙏" },
            { name: "恋人", symbol: "💕" },
            { name: "戦車", symbol: "🏇" },
            { name: "力", symbol: "🦁" },
            { name: "隠者", symbol: "🏮" },
            { name: "運命の輪", symbol: "☸️" },
            { name: "正義", symbol: "⚖️" },
            { name: "吊された男", symbol: "🙃" },
            { name: "死神", symbol: "💀" },
            { name: "節制", symbol: "🍶" },
            { name: "悪魔", symbol: "👹" },
            { name: "塔", symbol: "🗼" },
            { name: "星", symbol: "⭐" },
            { name: "月", symbol: "🌙" },
            { name: "太陽", symbol: "☀️" },
            { name: "審判", symbol: "📯" },
            { name: "世界", symbol: "🌍" }
        ];

        // 数秘術計算
        function calculateLifePath(dateString) {
            const digits = dateString.replace(/-/g, '').split('').map(Number);
            let sum = digits.reduce((a, b) => a + b, 0);
            
            while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            
            return sum;
        }

        function calculatePersonalYear(birthdate) {
            const date = new Date(birthdate);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            let sum = month + day + 2026;
            sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            
            while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            
            return sum;
        }

        // カードを引く
        function drawCards() {
            const shuffled = [...tarotCards].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, 3).map(card => ({
                ...card,
                reversed: Math.random() > 0.5
            }));
        }

        // ボタンクリックイベント
        document.getElementById('submitBtn').addEventListener('click', async function() {
            try {
                const name = document.getElementById('name').value;
                const birthdate = document.getElementById('birthdate').value;
                const fortuneType = document.querySelector('input[name="fortune"]:checked').value;

                if (!name || !birthdate) {
                    alert('お名前と生年月日を入力してください');
                    return;
                }

                // データ保存
                localStorage.setItem('fortune_name', name);
                localStorage.setItem('fortune_birthdate', birthdate);
                localStorage.setItem('fortune_type', fortuneType);

                // 画面切り替え
                document.getElementById('inputSection').style.display = 'none';
                document.getElementById('resultSection').style.display = 'block';

                // 数秘術計算
                const lifePath = calculateLifePath(birthdate);
                const personalYear = calculatePersonalYear(birthdate);

                // カードを引く
                const cards = drawCards();

                // 少し待つ
                await new Promise(resolve => setTimeout(resolve, 1500));

                // AI占い実行
                await generateReading(name, lifePath, personalYear, fortuneType, cards);

            } catch (error) {
                console.error('エラー:', error);
                alert('エラーが発生しました: ' + error.message);
                document.getElementById('inputSection').style.display = 'block';
                document.getElementById('resultSection').style.display = 'none';
            }
        });

        // AI占い実行
        async function generateReading(name, lifePath, personalYear, fortuneType, cards) {
            const fortuneNames = {
                work: '仕事運',
                money: '金運',
                love: '恋愛運',
                health: '健康運'
            };

            const prompt = `あなたは占いアプリのためのクリエイティブなメッセージを生成するライターです。以下の情報をもとに、占い風の創作的なメッセージを書いてください。これはエンターテインメント目的のフィクションです。

名前: ${name}さん
ライフパスナンバー: ${lifePath}
2026年パーソナルイヤー: ${personalYear}
選択した運勢: ${fortuneNames[fortuneType]}
引いたカード: 
- 過去: ${cards[0].name}（${cards[0].reversed ? '逆位置' : '正位置'}）
- 現在: ${cards[1].name}（${cards[1].reversed ? '逆位置' : '正位置'}）
- 未来: ${cards[2].name}（${cards[2].reversed ? '逆位置' : '正位置'}）

以下の要素を含む、前向きで具体的なアドバイスメッセージを3-4段落で作成してください:
1. 数秘術の数字から見た2026年の傾向
2. 各タロットカードが示す時期ごとのメッセージ
3. ${fortuneNames[fortuneType]}に関する具体的なアドバイス

※これは創作的なエンターテインメントコンテンツです。温かく励ましのある内容でお願いします。`;

            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 1000,
                        messages: [{ role: "user", content: prompt }]
                    })
                });

                if (!response.ok) {
                    throw new Error('AI応答エラー: ' + response.status);
                }

                const data = await response.json();
                const text = data.content.map(item => item.text || "").join("\n");

                displayResults(name, lifePath, personalYear, fortuneType, cards, text);

            } catch (error) {
                console.error('エラー:', error);
                document.getElementById('loading').innerHTML = `
                    <p style="color: #ff6b6b;">エラーが発生しました</p>
                    <p>${error.message}</p>
                    <button class="submit-btn" onclick="location.reload()">戻る</button>
                `;
            }
        }

        // 結果表示
        function displayResults(name, lifePath, personalYear, fortuneType, cards, reading) {
            const fortuneNames = {
                work: '仕事運',
                money: '金運',
                love: '恋愛運',
                health: '健康運'
            };

            // コピー用テキスト
            const copyText = `
🐴 ${name}さんの2026年 ${fortuneNames[fortuneType]} 🐴

【数秘術】
ライフパスナンバー: ${lifePath}
2026年パーソナルイヤー: ${personalYear}

【タロットカード】
過去: ${cards[0].name}（${cards[0].reversed ? '逆位置' : '正位置'}）
現在: ${cards[1].name}（${cards[1].reversed ? '逆位置' : '正位置'}）
未来: ${cards[2].name}（${cards[2].reversed ? '逆位置' : '正位置'}）

【鑑定結果】
${reading}

────────────────
2026年 午年運勢占い
            `.trim();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').innerHTML = `
                <h2 style="color: #ffd700; text-align: center; margin-bottom: 20px;">
                    🐴 ${name}さんの2026年 ${fortuneNames[fortuneType]} 🐴
                </h2>

                <div style="text-align: center; margin: 30px 0;">
                    <div style="display: inline-block; margin: 0 20px;">
                        <div style="font-size: 2.5em; color: #ffd700;">${lifePath}</div>
                        <div>ライフパスナンバー</div>
                    </div>
                    <div style="display: inline-block; margin: 0 20px;">
                        <div style="font-size: 2.5em; color: #ffd700;">${personalYear}</div>
                        <div>2026年パーソナルイヤー</div>
                    </div>
                </div>

                <div style="display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap;">
                    ${cards.map((card, i) => `
                        <div style="text-align: center;">
                            <div style="font-size: 3em;">${card.symbol}</div>
                            <div style="color: #ffd700; margin: 10px 0;">${['過去', '現在', '未来'][i]}</div>
                            <div>${card.name}</div>
                            <div style="font-size: 0.9em; color: #ffed4e;">${card.reversed ? '逆位置' : '正位置'}</div>
                        </div>
                    `).join('')}
                </div>

                <div style="background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 10px; line-height: 1.8; margin-bottom: 30px;">
                    ${reading.split('\n').filter(p => p.trim()).map(p => `<p style="margin-bottom: 15px;">${p}</p>`).join('')}
                </div>

                <button class="submit-btn" onclick="copyResult()" style="background: linear-gradient(135deg, #667eea, #764ba2); margin-bottom: 15px;">
                    📋 鑑定結果をコピー
                </button>

                <button class="submit-btn" onclick="openOfficialLine()" style="background: linear-gradient(135deg, #06c755, #00b900); margin-bottom: 15px;">
                    🔮 もっと詳しく鑑定する
                    <div style="font-size: 0.85em; margin-top: 5px; opacity: 0.9;">公式LINEで個別相談</div>
                </button>

                <button class="submit-btn" onclick="location.reload()">
                    🔄 もう一度占う
                </button>
            `;
            document.getElementById('results').style.display = 'block';

            // コピー機能
            window.copyResult = function() {
                navigator.clipboard.writeText(copyText).then(() => {
                    alert('✅ 鑑定結果をコピーしました!\nLINEやメモ帳に貼り付けてご利用ください。');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = copyText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('✅ 鑑定結果をコピーしました!');
                });
            };

            // 公式LINE誘導
            window.openOfficialLine = function() {
                // ★★★ ここに公式LINEのURLを設定してください ★★★
                const lineURL = 'https://lin.ee/XXXXXXX';
                window.open(lineURL, '_blank');
            };
        }
    </script>
</body>
</html>
