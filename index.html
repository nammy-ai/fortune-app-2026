<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年 午年運勢占い</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
            background: linear-gradient(135deg, #1a0533 0%, #2d1b4e 50%, #4a1942 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2em;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .horse {
            font-size: 3em;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1em;
        }

        input[type="text"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .fortune-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }

        .fortune-option {
            position: relative;
        }

        .fortune-option input[type="radio"] {
            position: absolute;
            opacity: 0;
        }

        .fortune-option label {
            display: block;
            padding: 15px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .fortune-option input[type="radio"]:checked + label {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .fortune-option label:hover {
            border-color: #ffd700;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #1a0533;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }

        .result {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }
            .fortune-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <div class="header">
            <h1>✨ 2026年 午年運勢占い ✨</h1>
            <div class="horse">🐴🌙⭐</div>
        </div>

        <div class="card" id="inputSection">
            <div>
                <div class="form-group">
                    <label for="name">お名前（ペンネームOK）</label>
                    <input type="text" id="name" placeholder="例：花子">
                </div>

                <div class="form-group">
                    <label for="birthdate">生年月日</label>
                    <input type="date" id="birthdate">
                </div>

                <div class="form-group">
                    <label>占いたい運勢を選択</label>
                    <div class="fortune-options">
                        <div class="fortune-option">
                            <input type="radio" id="work" name="fortune" value="work" checked>
                            <label for="work">💼 仕事運</label>
                        </div>
                        <div class="fortune-option">
                            <input type="radio" id="money" name="fortune" value="money">
                            <label for="money">💰 金運</label>
                        </div>
                        <div class="fortune-option">
                            <input type="radio" id="love" name="fortune" value="love">
                            <label for="love">💕 恋愛運</label>
                        </div>
                        <div class="fortune-option">
                            <input type="radio" id="health" name="fortune" value="health">
                            <label for="health">🌿 健康運</label>
                        </div>
                    </div>
                </div>

                <button type="button" class="submit-btn" id="submitBtn">🔮 運勢を占う 🔮</button>
            </div>
        </div>

        <div class="card result" id="resultSection">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>カードをシャッフル中...</p>
            </div>
            <div id="results"></div>
        </div>
    </div>

    <script>
        // 星を生成
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }
        createStars();

        // 保存データ復元
        const savedName = localStorage.getItem('fortune_name');
        const savedBirthdate = localStorage.getItem('fortune_birthdate');
        const savedFortune = localStorage.getItem('fortune_type');

        if (savedName) document.getElementById('name').value = savedName;
        if (savedBirthdate) document.getElementById('birthdate').value = savedBirthdate;
        if (savedFortune) {
            const radio = document.getElementById(savedFortune);
            if (radio) radio.checked = true;
        }

        // タロットカードデータ
        const tarotCards = [
            { 
                name: "愚者", 
                symbol: "🃏",
                upright: "新しい始まり、自由、冒険心、純粋さ。恐れることなく一歩を踏み出す時です。",
                reversed: "無謀さ、計画性の欠如。慎重さが必要な時期です。"
            },
            { 
                name: "魔術師", 
                symbol: "🎩",
                upright: "創造力、実行力、才能の開花。あなたの持つスキルを最大限に活かせる時です。",
                reversed: "力の乱用、集中力不足。焦らず基礎を固めましょう。"
            },
            { 
                name: "女教皇", 
                symbol: "📿",
                upright: "直感、知恵、内なる声。静かに自分の心の声に耳を傾ける時です。",
                reversed: "秘密、感情の抑圧。もっと素直になることが大切です。"
            },
            { 
                name: "女帝", 
                symbol: "👑",
                upright: "豊かさ、創造性、愛情。周囲を包み込む優しさが幸運を引き寄せます。",
                reversed: "依存、過保護。自立心を大切にしましょう。"
            },
            { 
                name: "皇帝", 
                symbol: "⚔️",
                upright: "リーダーシップ、安定、秩序。責任ある立場で力を発揮できます。",
                reversed: "支配欲、頑固さ。柔軟性を持つことが成功の鍵です。"
            },
            { 
                name: "教皇", 
                symbol: "🙏",
                upright: "伝統、教え、精神的な導き。師や先輩からの学びが深まります。",
                reversed: "形式主義、独断。自分らしさを大切にしましょう。"
            },
            { 
                name: "恋人", 
                symbol: "💕",
                upright: "愛、調和、重要な選択。心からの絆が深まる時期です。",
                reversed: "迷い、不調和。自分の気持ちと向き合う必要があります。"
            },
            { 
                name: "戦車", 
                symbol: "🏇",
                upright: "勝利、前進、意志の力。目標に向かって突き進む力があります。",
                reversed: "暴走、方向性の喪失。一度立ち止まって考えましょう。"
            },
            { 
                name: "力", 
                symbol: "🦁",
                upright: "勇気、忍耐、優しさの強さ。内なる力で困難を乗り越えられます。",
                reversed: "自信喪失、弱気。自分を信じることが大切です。"
            },
            { 
                name: "隠者", 
                symbol: "🏮",
                upright: "内省、真理の探求、一人の時間。静かに自分と向き合う時です。",
                reversed: "孤立、閉鎖的。周囲とのつながりを大切にしましょう。"
            },
            { 
                name: "運命の輪", 
                symbol: "☸️",
                upright: "転機、幸運、新しいサイクル。大きな変化の時が訪れます。",
                reversed: "停滞、運気の低下。焦らず時を待つことも必要です。"
            },
            { 
                name: "正義", 
                symbol: "⚖️",
                upright: "公平、真実、バランス。正しい選択が良い結果をもたらします。",
                reversed: "不公平、偏見。客観的な視点を持ちましょう。"
            },
            { 
                name: "吊された男", 
                symbol: "🙃",
                upright: "視点の転換、献身、待つこと。新しい角度から物事を見る時です。",
                reversed: "無駄な犠牲、停滞。行動する勇気が必要です。"
            },
            { 
                name: "死神", 
                symbol: "💀",
                upright: "終わりと始まり、変容、再生。古いものを手放し新しい自分へ。",
                reversed: "変化への抵抗、停滞。変化を恐れず受け入れましょう。"
            },
            { 
                name: "節制", 
                symbol: "🍶",
                upright: "調和、バランス、適度さ。心と体のバランスが整います。",
                reversed: "不摂生、極端さ。中庸を心がけましょう。"
            },
            { 
                name: "悪魔", 
                symbol: "👹",
                upright: "誘惑、束縛、物質主義。執着を手放す必要があります。",
                reversed: "解放、自由。束縛から解き放たれる時です。"
            },
            { 
                name: "塔", 
                symbol: "🗼",
                upright: "突然の変化、崩壊、啓示。古い価値観が崩れ新しい道が開けます。",
                reversed: "危機回避、恐れ。変化を恐れず前を向きましょう。"
            },
            { 
                name: "星", 
                symbol: "⭐",
                upright: "希望、癒し、インスピレーション。明るい未来への希望が見えます。",
                reversed: "失望、不安。信じる心を取り戻しましょう。"
            },
            { 
                name: "月", 
                symbol: "🌙",
                upright: "直感、夢、不安。潜在意識からのメッセージに注目を。",
                reversed: "混乱、幻想。現実をしっかり見つめましょう。"
            },
            { 
                name: "太陽", 
                symbol: "☀️",
                upright: "成功、喜び、活力。最高の運気が訪れています。",
                reversed: "一時的な停滞。もうすぐ光が差します。"
            },
            { 
                name: "審判", 
                symbol: "📯",
                upright: "復活、目覚め、新生。過去を清算し新しいステージへ。",
                reversed: "後悔、自己批判。自分を許し前に進みましょう。"
            },
            { 
                name: "世界", 
                symbol: "🌍",
                upright: "完成、達成、統合。大きな目標を達成できる時です。",
                reversed: "未完成、中途半端。最後まで諦めずに取り組みましょう。"
            }
        ];

        // 数秘術の意味
        const numerologyMeanings = {
            1: "リーダーシップと新しい始まり。自分の道を切り開く力強い年です。",
            2: "協調と調和。人との繋がりが深まり、パートナーシップが重要になります。",
            3: "創造性と表現。自己表現が花開き、喜びに満ちた年になります。",
            4: "安定と基盤作り。着実な努力が実を結ぶ、堅実な年です。",
            5: "変化と自由。新しい経験と冒険が待っている刺激的な年です。",
            6: "愛と責任。家族や身近な人との絆が深まる温かい年です。",
            7: "内省と精神性。自分自身と深く向き合い、真理を探求する年です。",
            8: "成功と達成。物質的な豊かさと社会的な成功を手にする年です。",
            9: "完成と手放し。一つのサイクルが終わり、新しい始まりへの準備をする年です。",
            11: "直感と啓示。スピリチュアルな目覚めと高次の導きがある特別な年です。",
            22: "マスタービルダー。大きな夢を現実化する力を持つパワフルな年です。",
            33: "無条件の愛と奉仕。他者への献身が喜びとなる神聖な年です。"
        };

        // 運勢別アドバイス
        const fortuneAdvice = {
            work: {
                title: "仕事運",
                general: "2026年のあなたの仕事運は、数秘術とタロットが示す通り、大きな可能性に満ちています。"
            },
            money: {
                title: "金運",
                general: "2026年の金運は、賢明な選択と計画的な行動によって大きく開花します。"
            },
            love: {
                title: "恋愛運（対人運）",
                general: "2026年の人間関係は、真心と誠実さがキーワードとなります。"
            },
            health: {
                title: "健康運",
                general: "2026年の健康運は、心と体のバランスを保つことが何より大切です。"
            }
        };

        // 数秘術計算
        function calculateLifePath(dateString) {
            const digits = dateString.replace(/-/g, '').split('').map(Number);
            let sum = digits.reduce((a, b) => a + b, 0);
            
            while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            
            return sum;
        }

        function calculatePersonalYear(birthdate) {
            const date = new Date(birthdate);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            
            let sum = month + day + 2026;
            sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            
            while (sum > 9 && sum !== 11 && sum !== 22 && sum !== 33) {
                sum = sum.toString().split('').map(Number).reduce((a, b) => a + b, 0);
            }
            
            return sum;
        }

        // カードを引く
        function drawCards() {
            const shuffled = [...tarotCards].sort(() => Math.random() - 0.5);
            return shuffled.slice(0, 3).map(card => ({
                ...card,
                reversed: Math.random() > 0.5
            }));
        }

        // ボタンクリック
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const name = document.getElementById('name').value;
            const birthdate = document.getElementById('birthdate').value;
            const fortuneType = document.querySelector('input[name="fortune"]:checked').value;

            if (!name || !birthdate) {
                alert('お名前と生年月日を入力してください');
                return;
            }

            localStorage.setItem('fortune_name', name);
            localStorage.setItem('fortune_birthdate', birthdate);
            localStorage.setItem('fortune_type', fortuneType);

            document.getElementById('inputSection').style.display = 'none';
            document.getElementById('resultSection').style.display = 'block';

            const lifePath = calculateLifePath(birthdate);
            const personalYear = calculatePersonalYear(birthdate);
            const cards = drawCards();

            await new Promise(resolve => setTimeout(resolve, 1500));

            displayResults(name, lifePath, personalYear, fortuneType, cards);
        });

        // 結果表示
        function displayResults(name, lifePath, personalYear, fortuneType, cards) {
            const advice = fortuneAdvice[fortuneType];
            
            // 鑑定メッセージ生成
            let reading = `${advice.general}\n\n`;
            reading += `ライフパスナンバー${lifePath}のあなたは、${numerologyMeanings[lifePath]}\n\n`;
            reading += `2026年のパーソナルイヤー${personalYear}は、${numerologyMeanings[personalYear]}\n\n`;
            
            reading += `過去のカード「${cards[0].name}」は、${cards[0].reversed ? cards[0].reversed : cards[0].upright}\n\n`;
            reading += `現在のカード「${cards[1].name}」は、${cards[1].reversed ? cards[1].reversed : cards[1].upright}\n\n`;
            reading += `未来のカード「${cards[2].name}」は、${cards[2].reversed ? cards[2].reversed : cards[2].upright}\n\n`;
            
            reading += `これらのメッセージを総合すると、2026年のあなたは自分自身の内なる力を信じて前進することで、素晴らしい成果を手にすることができるでしょう。`;

            const copyText = `
🐴 ${name}さんの2026年 ${advice.title} 🐴

【数秘術】
ライフパスナンバー: ${lifePath}
2026年パーソナルイヤー: ${personalYear}

【タロットカード】
過去: ${cards[0].name}（${cards[0].reversed ? '逆位置' : '正位置'}）
現在: ${cards[1].name}（${cards[1].reversed ? '逆位置' : '正位置'}）
未来: ${cards[2].name}（${cards[2].reversed ? '逆位置' : '正位置'}）

【鑑定結果】
${reading}

────────────────
2026年 午年運勢占い
            `.trim();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('results').innerHTML = `
                <h2 style="color: #ffd700; text-align: center; margin-bottom: 20px;">
                    🐴 ${name}さんの2026年 ${advice.title} 🐴
                </h2>

                <div style="text-align: center; margin: 30px 0;">
                    <div style="display: inline-block; margin: 0 20px;">
                        <div style="font-size: 2.5em; color: #ffd700;">${lifePath}</div>
                        <div>ライフパスナンバー</div>
                    </div>
                    <div style="display: inline-block; margin: 0 20px;">
                        <div style="font-size: 2.5em; color: #ffd700;">${personalYear}</div>
                        <div>2026年パーソナルイヤー</div>
                    </div>
                </div>

                <div style="display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap;">
                    ${cards.map((card, i) => `
                        <div style="text-align: center;">
                            <div style="font-size: 3em;">${card.symbol}</div>
                            <div style="color: #ffd700; margin: 10px 0;">${['過去', '現在', '未来'][i]}</div>
                            <div>${card.name}</div>
                            <div style="font-size: 0.9em; color: #ffed4e;">${card.reversed ? '逆位置' : '正位置'}</div>
                        </div>
                    `).join('')}
                </div>

                <div style="background: rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 10px; line-height: 1.8; margin-bottom: 30px;">
                    ${reading.split('\n\n').map(p => `<p style="margin-bottom: 15px;">${p}</p>`).join('')}
                </div>

                <button class="submit-btn" onclick="copyResult()" style="background: linear-gradient(135deg, #667eea, #764ba2); margin-bottom: 15px;">
                    📋 鑑定結果をコピー
                </button>

                <button class="submit-btn" onclick="openOfficialLine()" style="background: linear-gradient(135deg, #06c755, #00b900); margin-bottom: 15px;">
                    🔮 もっと詳しく鑑定する
                    <div style="font-size: 0.85em; margin-top: 5px; opacity: 0.9;">公式LINEで個別相談</div>
                </button>

                <button class="submit-btn" onclick="location.reload()">
                    🔄 もう一度占う
                </button>
            `;
            document.getElementById('results').style.display = 'block';

            window.copyResult = function() {
                navigator.clipboard.writeText(copyText).then(() => {
                    alert('✅ 鑑定結果をコピーしました!\nLINEやメモ帳に貼り付けてご利用ください。');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = copyText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('✅ 鑑定結果をコピーしました!');
                });
            };

            window.openOfficialLine = function() {
                const lineURL = 'https://lin.ee/0q368a9';
                window.open(lineURL, '_blank');
            };
        }
    </script>
</body>
</html>
